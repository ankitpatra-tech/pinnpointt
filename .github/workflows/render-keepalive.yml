name: Render Keep-Alive Heartbeat

on:
  schedule:
    # Runs every 12 minutes to prevent Render free-tier from sleeping after 15 min
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Check
        run: |
          RENDER_URL="${{ secrets.RENDER_APP_URL || vars.RENDER_APP_URL }}"
          if [ -z "$RENDER_URL" ]; then
            echo "RENDER_APP_URL secret/var not configured yet. Set RENDER_APP_URL in Repo Settings > Secrets or Variables to enable."
            exit 0
          fi
          echo "Pinging $RENDER_URL/health..."
          curl -f -s -S "$RENDER_URL/health" || curl -f -s -S "$RENDER_URL" || true
